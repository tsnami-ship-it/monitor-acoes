name: Monitor de ações

on:
  schedule:
    # Horários em UTC (Brasília + 3h), só em dias úteis.
    - cron: "30 14 * * 1-5"   # 11:30
    - cron: "5 17 * * 1-5"    # 14:05
    - cron: "30 19 * * 1-5"   # 16:30
    - cron: "20 22 * * 1-5"   # 19:20, depois do fechamento
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      # Clone direto com git, sem actions de terceiros: nada para atualizar
      # de versão no futuro.
      - name: Baixar o repositório
        run: git clone --depth 1 "$REPO_URL" .

      - name: Testar as regras
        run: python3 -m unittest discover -s tests

      - name: Coletar cotações e gerar sinais
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: python3 monitor.py

      - name: Gravar os dados no repositório
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "dados: $(date -u +%F)"
            git push
          fi
